<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERY+ SECURITY - Controle de Estoque</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        .container { 
            background: rgba(15, 23, 42, 0.9); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            border-radius: 20px; 
            padding: 35px; 
            width: 100%; 
            max-width: 520px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.1); 
            backdrop-filter: blur(12px); 
        }
        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-icon { font-size: 40px; margin-bottom: 10px; }
        h1 { color: #38bdf8; font-size: 26px; font-weight: bold; letter-spacing: 0.5px; }
        h1 span { color: #fff; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-top: 5px; }
        
        /* Estilo dos Botões do Menu */
        .btn-menu { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
            padding: 18px 22px; 
            margin-bottom: 14px; 
            border-radius: 12px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            color: white; 
            transition: transform 0.2s, box-shadow 0.2s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        }
        .btn-menu:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3); }
        
        .btn-1 { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-2 { background: linear-gradient(135deg, #0d9488, #0f766e); }
        .btn-4 { background: linear-gradient(135deg, #d97706, #b45309); }
        .btn-fast { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-logout { background: linear-gradient(135deg, #dc2626, #991b1b); }
        
        .status-footer { text-align: center; margin-top: 20px; font-size: 12px; color: #64748b; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }

        /* Estilo para Tela de Login e Modais */
        .login-box input { width: 100%; background: #020617; color: #fff; border: 1px solid #334155; padding: 14px; border-radius: 10px; margin-bottom: 15px; outline: none; font-size: 14px; }
        .login-box input:focus { border-color: #38bdf8; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: #0f172a; padding: 30px; border-radius: 16px; width: 100%; max-width: 600px; color: #fff; border: 1px solid rgba(56,189,248,0.3); box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN (Se não estiver autenticado) -->
    <div class="container" id="telaLogin">
        <div class="logo-area">
            <div class="logo-icon">🛡️</div>
            <h1>VERY+ <span>SECURITY</span></h1>
            <div class="subtitle">MAIS SEGURANÇA PARA O SEU DIA A DIA</div>
        </div>
        <div class="login-box">
            <input type="text" id="loginUsuario" placeholder="Usuário (ex: admin)">
            <input type="password" id="loginSenha" placeholder="Senha (ex: 1234)">
            <button onclick="fazerLogin()" class="btn-menu btn-1" style="justify-content: center; font-size: 16px;">Entrar</button>
        </div>
        <div class="status-footer">ACESSO RESTRITO • SEGURANÇA E CONTROLE</div>
    </div>

    <!-- PAINEL PRINCIPAL (Aparece após o Login) -->
    <div class="container" id="painelPrincipal" style="display: none;">
        <div class="logo-area" style="margin-bottom: 20px;">
            <div class="logo-icon" style="font-size: 32px;">🛡️</div>
            <h1 style="font-size: 22px;">VERY+ <span>SECURITY</span></h1>
            <div class="subtitle">Controle de Estoque Inteligente</div>
        </div>

        <button onclick="alert('Funcionalidade de Cadastro por Modal')" class="btn-menu btn-1">
            <div style="text-align: left;">
                <div style="font-size: 15px;">1 - Cadastrar Aparelho</div>
                <div style="font-size: 11px; opacity: 0.8; font-weight: normal;">Registre um novo aparelho no sistema.</div>
            </div>
            <span>›</span>
        </button>

        <button onclick="alert('Estoque Completo')" class="btn-menu btn-2">
            <div style="text-align: left;">
                <div style="font-size: 15px;">2 - Verificar Aparelhos em Estoque</div>
                <div style="font-size: 11px; opacity: 0.8; font-weight: normal;">Confira os aparelhos cadastrados.</div>
            </div>
            <span>›</span>
        </button>

        <button onclick="alert('Baixa Unitária')" class="btn-menu btn-4">
            <div style="text-align: left;">
                <div style="font-size: 15px;">4 - Registrar Venda (Baixa)</div>
                <div style="font-size: 11px; opacity: 0.8; font-weight: normal;">Registre a venda e atualize o estoque.</div>
            </div>
            <span>›</span>
        </button>

        <!-- PONTO 5: EXTREMELY FAST -->
        <button onclick="abrirModalExtremelyFast()" class="btn-menu btn-fast">
            <div style="text-align: left;">
                <div style="font-size: 15px;">5 - ⚡ EXTREMELY FAST (Auditoria)</div>
                <div style="font-size: 11px; opacity: 0.8; font-weight: normal;">Conferência relâmpago por múltiplos IMEIs.</div>
            </div>
            <span>›</span>
        </button>

        <button onclick="fazerLogout()" class="btn-menu btn-logout">
            <div style="text-align: left;">
                <div style="font-size: 15px;">Sair / Deslogar</div>
                <div style="font-size: 11px; opacity: 0.8; font-weight: normal;">Encerrar sua sessão com segurança.</div>
            </div>
            <span>›</span>
        </button>

        <div class="status-footer">⏳ Aguardando ação...</div>
    </div>

    <!-- MODAL EXTREMELY FAST (PONTO 5) -->
    <div id="modalExtremelyFast" class="modal">
        <div class="modal-content">
            <h2 style="color: #ff4b2b; margin-bottom: 8px; font-size: 20px;">⚡ EXTREMELY FAST - Auditoria Relâmpago</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">Cole ou digite os IMEIs dos aparelhos (um por linha ou separados por espaço/vírgula):</p>
            
            <textarea id="inputImeisFast" rows="6" placeholder="Ex: 123456789012345&#10;987654321098765" style="width: 100%; background: #020617; color: #fff; border: 1px solid #334155; padding: 12px; border-radius: 8px; font-family: monospace; resize: vertical; outline: none; margin-bottom: 15px;"></textarea>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="executarAuditoriaFast()" style="background: #22c55e; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1;">Verificar / OK</button>
                <button onclick="fecharModalExtremelyFast()" style="background: #475569; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Fechar</button>
            </div>

            <!-- Resultados Coloridos -->
            <div id="resultadoExtremelyFast" style="margin-top: 20px; max-height: 250px; overflow-y: auto; display: none; border-top: 1px solid #334155; padding-top: 15px;"></div>
        </div>
    </div>

    <script>
        // Lógica de Login Simples e Funcional
        function fazerLogin() {
            const u = document.getElementById('loginUsuario').value.trim();
            const s = document.getElementById('loginSenha').value.trim();
            if (u === 'admin' && s === '1234') {
                document.getElementById('telaLogin').style.display = 'none';
                document.getElementById('painelPrincipal').style.display = 'block';
            } else {
                alert('Usuário ou senha incorretos! Use admin / 1234');
            }
        }

        function fazerLogout() {
            document.getElementById('painelPrincipal').style.display = 'none';
            document.getElementById('telaLogin').style.display = 'block';
            document.getElementById('loginUsuario').value = '';
            document.getElementById('loginSenha').value = '';
        }

        function abrirModalExtremelyFast() {
            document.getElementById('inputImeisFast').value = '';
            document.getElementById('resultadoExtremelyFast').style.display = 'none';
            document.getElementById('modalExtremelyFast').style.display = 'flex';
        }

        function fecharModalExtremelyFast() {
            document.getElementById('modalExtremelyFast').style.display = 'none';
        }

        async function executarAuditoriaFast() {
            const texto = document.getElementById('inputImeisFast').value;
            const imeis = texto.split(/[\n,\s]+/).map(i => i.trim()).filter(i => i.length > 0);

            if (imeis.length === 0) {
                alert('Por favor, insira pelo menos um IMEI.');
                return;
            }

            try {
                const response = await fetch('/api/auditoria', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imeis })
                });
                const data = await response.json();

                const resDiv = document.getElementById('resultadoExtremelyFast');
                resDiv.style.display = 'block';
                resDiv.innerHTML = `
                    <div style="background: #020617; padding: 12px; border-radius: 8px; border: 1px solid #334155;">
                        <h3 style="margin-bottom: 10px; color: #38bdf8; font-size: 15px;">📊 Relatório da Auditoria:</h3>
                        
                        <div style="margin-bottom: 10px; background: rgba(34, 197, 94, 0.1); padding: 8px; border-left: 4px solid #22c55e; border-radius: 4px;">
                            <strong style="color: #22c55e;">🟢 OK / Conferidos (${data.ok.length}):</strong>
                            <ul style="margin: 4px 0 0 18px; font-size: 11px; color: #cbd5e1;">
                                ${data.ok.length > 0 ? data.ok.map(i => `<li>${i.marca}${i.modelo} (${i.memoria}) - IMEI:${i.imei}</li>`).join('') : '<li>Nenhum</li>'}
                            </ul>
                        </div>

                        <div style="margin-bottom: 10px; background: rgba(239, 68, 68, 0.1); padding: 8px; border-left: 4px solid #ef4444; border-radius: 4px;">
                            <strong style="color: #ef4444;">🔴 Faltantes no Estoque Físico (${data.faltantes.length}):</strong>
                            <ul style="margin: 4px 0 0 18px; font-size: 11px; color: #cbd5e1;">
                                ${data.faltantes.length > 0 ? data.faltantes.map(i => `<li>${i.marca}${i.modelo} (${i.memoria}) - IMEI:${i.imei}</li>`).join('') : '<li>Nenhum! Estoque 100% conferido.</li>'}
                            </ul>
                        </div>

                        <div style="background: rgba(234, 179, 8, 0.1); padding: 8px; border-left: 4px solid #eab308; border-radius: 4px;">
                            <strong style="color: #eab308;">🟡 IMEIs Inválidos / Erro de Digitação (${data.invalidos.length}):</strong>
                            <ul style="margin: 4px 0 0 18px; font-size: 11px; color: #cbd5e1;">
                                ${data.invalidos.length > 0 ? data.invalidos.map(i => `<li>${i}</li>`).join('') : '<li>Nenhum erro de digitação</li>'}
                            </ul>
                        </div>
                    </div>
                `;
            } catch (err) {
                alert('Erro ao conectar com o servidor para auditoria.');
            }
        }
    </script>
</body>
</html>
